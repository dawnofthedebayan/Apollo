name: Generate Quizzes

on:
  push:
    paths:
      - 'Debayan_Personal/05-idea/**/*.md'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install langchain-openrouter langchain-core pydantic python-dotenv

      - name: Run quiz generator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUIZ_INPUT_DIR:  ${{ github.workspace }}/05-idea
          QUIZ_OUTPUT_DIR: ${{ github.workspace }}/07-Apollo/05-idea
        run: python 07-Apollo/00-code/knowledge_agent/knowledge_agent.py

      - name: Generate quiz manifest
        run: python 07-Apollo/00-code/util/generate_manifest.py

      - name: Commit generated quizzes and updated manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 07-Apollo/05-idea/ docs/
          git diff --staged --quiet || (git commit -m "chore: regenerate quizzes [skip ci]" && git push)